# Depot CI is this fork's single CI gate (JCK-2026). It replaces upstream's GitHub Actions
# workflows (ci, audit, docker-publish, release, aur, winget, arch-repo). This fork builds and
# tests on Linux only; upstream's macOS/Windows legs, signing and package publishing were dropped.
# Require only `depot-ci / ci-result`; it fails unless every job below succeeded.
name: depot-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: depot-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every pushed branch must carry its Linear key (bots exempt). PR-only; pushes to main skip it.
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Branch names its Linear issue (jck-<n>)
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "branch: $HEAD_REF"
          case "$HEAD_REF" in dependabot/*|renovate/*|release-please--*) exit 0 ;; esac
          echo "$HEAD_REF" | grep -Eiq '(^|[^a-z0-9])jck-[0-9]+' || { echo "::error::Branch '$HEAD_REF' has no Linear key; use the issue's gitBranchName (jck-<n>-topic)"; exit 1; }

  # Pinned gitleaks binary (gitleaks-action demands an org license on Depot CI).
  gitleaks:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (new commits; full history when there is no base)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # linux_x64
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          curl -fsSLo /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          if [ -n "$BASE" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            /tmp/gitleaks git --redact --no-banner --log-opts="${BASE}..HEAD" .
          else
            /tmp/gitleaks git --redact --no-banner .
          fi

  # Frontend build and tests, Rust tests, the headless gateway build and its smoke tests.
  build-test:
    name: Linux build + test
    # Hang backstop, not a target: this job does the most (frontend, Rust, gateway smoke).
    timeout-minutes: 45
    runs-on: depot-ubuntu-24.04-4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install Linux build dependencies
        # WebKitGTK + the Secret Service (libdbus) deps the Tauri lib needs to compile on Linux.
        run: scripts/ci-apt-install.sh libwebkit2gtk-4.1-dev libsoup-3.0-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libdbus-1-dev

      - name: Cache cargo + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - run: npm ci

      - name: Production dependency audit
        run: npm run audit:prod

      # Fails fast on formatting-only issues before the full build.
      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # `build` is `tsc && vite build`; it also produces dist/, which tauri-build expects.
      - name: Frontend type-check + build
        run: npm run build

      - name: Frontend tests
        run: npm run test

      - name: Startup bundle budget
        run: npm run bench:bundle

      - name: Install browser for offline UI smoke
        run: npx playwright install --with-deps chromium

      - name: Offline browser fixture smoke
        run: npm run smoke:browser

      - name: Keep browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-smoke-diagnostics
          path: .verify/browser-*/
          include-hidden-files: true
          if-no-files-found: ignore

      # Library, standalone binary and integration targets, so no test class silently drops out.
      - name: Rust tests (lib + binaries + integration)
        run: npm run test:rust

      - name: Build headless gateway for smoke tests
        run: npm run build:gateway

      - name: Headless gateway security smoke
        run: npm run smoke:headless

  # Native GTK shell (skips WebKit/Tauri). Ubuntu 24.04 provides GTK >= 4.10 and libadwaita >= 1.4.
  linux-native:
    name: Linux-native GTK preview
    timeout-minutes: 30
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install GTK build dependencies
        run: scripts/ci-apt-install.sh build-essential libssl-dev pkg-config libdbus-1-dev libgtk-4-dev libadwaita-1-dev
      - name: Cache cargo + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-gtk-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-gtk-cargo-
      - name: Build the native GTK shell
        run: cargo check --manifest-path src-tauri/Cargo.toml --no-default-features --features gtk-desktop --bin toolport-gtk
      - name: Test the native shell module
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features
          --features gtk-desktop --lib linux_native::

  # Headless (no desktop feature) Rust tests, the Linux leg of upstream's cross-platform matrix.
  headless-rust:
    name: Headless Rust tests (linux)
    timeout-minutes: 30
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      # The headless build skips Tauri/WebKit, but the Linux keyring backend still needs libdbus headers.
      - name: Install Linux build dependencies
        run: scripts/ci-apt-install.sh build-essential libssl-dev pkg-config libdbus-1-dev
      - name: Cache cargo + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-headless-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-headless-cargo-
      - name: Rust tests (lib + binaries + integration, no desktop)
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --lib --bins --tests

  # Upstream ran Clippy as non-blocking until its existing warnings were cleared; kept advisory
  # here (continue-on-error) and excluded from ci-result.
  clippy:
    name: Rust Clippy (advisory)
    timeout-minutes: 30
    runs-on: depot-ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy
      - name: Install Linux build dependencies
        run: scripts/ci-apt-install.sh build-essential libssl-dev pkg-config libdbus-1-dev
      # --no-default-features matches every other headless Rust job (no GTK/WebKit headers needed).
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --lib --bins

  # RustSec advisories. Upstream also ran this weekly on a schedule; run it on every PR/push here.
  audit:
    name: Cargo audit
    timeout-minutes: 15
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit dependencies
        working-directory: src-tauri
        run: cargo audit

  # scripts/install.sh is piped into bash from a pinned commit; its download verification
  # (https-only, per-asset digest, truncation, empty-file rejection) is covered by this suite (SBS-902).
  installer-script-bash:
    name: Installer script tests (bash)
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Bash tests for scripts/install.sh
        run: bash scripts/install.Tests.bash

  # SBS-894: toolport.app/install.* redirect to a PINNED COMMIT because the scripts are piped
  # into a shell; a movable ref (main/master/HEAD) in any hint routes around that.
  pinned-install-urls:
    name: Pinned installer URLs
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: No file may point at an unpinned installer path
        run: |
          # Every MOVABLE ref, not just `main`: raw.githubusercontent serves HEAD and master the
          # same way. This file is excluded because the pattern below is itself an occurrence.
          matches="$(git grep -nE -- '(main|master|HEAD)/scripts/' -- ':!.depot/workflows/ci.yml' || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo
            echo "The lines above point at an unpinned installer path."
            echo "toolport.app/install.* redirects to a PINNED COMMIT because those"
            echo "scripts are piped into a shell; a movable ref routes around that."
            echo "Use https://toolport.app/install.sh and /install.ps1 (SBS-894)."
            exit 1
          fi

  # Headless gateway image, validated on every PR and kept in the Depot Registry on main.
  # Upstream pushed this to GHCR (ghcr.io/btsouth/...); this fork does not publish it.
  gateway-image:
    name: Gateway image (Depot build)
    timeout-minutes: 30
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install Linux build dependencies
        run: scripts/ci-apt-install.sh build-essential libssl-dev pkg-config libdbus-1-dev
      # Cache DEPENDENCY build artifacts only, never the workspace's own crates (SBS-926):
      # Swatinem/rust-cache evicts workspace members before saving, so they always recompile
      # from the current commit. Do NOT replace this with a plain actions/cache of target/.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          key: docker-gateway
          cache-bin: "false"
      # Binary tests link the library without cfg(test), so release-profile tests need the
      # test-support hooks. Rebuild without the feature afterwards so the image gets a production binary.
      - name: Test toolport-gateway
        run: cargo test --release --bin toolport-gateway --manifest-path src-tauri/Cargo.toml --no-default-features --features test-support
      - name: Build production toolport-gateway
        run: cargo build --release --bin toolport-gateway --manifest-path src-tauri/Cargo.toml --no-default-features
      - name: Stage binary for Dockerfile
        run: cp src-tauri/target/release/toolport-gateway toolport-gateway-bin && chmod 755 toolport-gateway-bin
      - uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2
      - uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        with:
          project: 6bqq7xw8q8
          context: .
          file: Dockerfile
          save: ${{ github.event_name == 'push' }}
          save-tags: ${{ github.sha }}

  # Required verdict. Branch protection requires only `depot-ci / ci-result`.
  # Clippy stays advisory and is not listed.
  ci-result:
    name: ci-result
    if: always()
    needs:
      [
        branch-name,
        gitleaks,
        build-test,
        linux-native,
        headless-rust,
        audit,
        installer-script-bash,
        pinned-install-urls,
        gateway-image,
      ]
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every job to succeed (skipped branch-name on push is fine)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do case "$r" in success|skipped) ;; *) exit 1 ;; esac; done
